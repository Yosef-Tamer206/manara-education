<style>
:root{--ink:#14264f;--ink2:#0046ac;--accent:#ff800a;--accent-d:#e06a00;--bg:#f4f7fb;--card:#fff;--line:#e3e7f0;--muted:#5d6985;--ok:#14915c;--bad:#c93a3a;--r:16px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Almarai','Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1160px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo i{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-style:normal;font-size:22px}
.nav nav{display:flex;gap:6px;margin-inline-start:auto}
.nav nav a{padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted);font-size:15px}
.nav nav a:hover,.nav nav a.on{background:var(--bg);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 22px;font-weight:700;font-size:15px;background:var(--ink);color:#fff;transition:.15s}
.btn:hover{background:var(--ink2);transform:translateY(-1px)}
.btn.gold{background:var(--accent);color:#1d1400}.btn.gold:hover{background:#f2b52e}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--ink);background:#fff}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:10px}
.hero{background:linear-gradient(135deg,var(--ink) 0%,#16295a 100%);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(232,163,23,.18),transparent 45%);}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:76px 20px;position:relative}
.tag{display:inline-block;background:rgba(232,163,23,.16);color:#ffd27a;border:1px solid rgba(232,163,23,.4);padding:4px 14px;border-radius:99px;font-size:14px;font-weight:700}
.hero h1{font-size:46px;line-height:1.3;margin:16px 0;font-weight:800}
.hero h1 b{color:var(--accent)}
.hero p{color:#c6d0ea;font-size:18px;max-width:540px}
.cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}.hero .btn.ghost:hover{background:rgba(255,255,255,.1);border-color:#fff}
.tcard{background:#fff;color:var(--ink);border-radius:22px;padding:26px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#f6cf74);display:grid;place-items:center;font-size:42px;font-weight:800;color:var(--ink);margin-bottom:14px}
.tcard h3{font-size:22px}.tcard .sub{color:var(--muted);font-size:15px}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
.tstats b{display:block;font-size:24px;color:var(--ink)}.tstats span{font-size:13px;color:var(--muted)}
section{padding:68px 0}
.sh{margin-bottom:32px}.sh small{color:var(--accent-d);font-weight:800;font-size:14px}
.sh h2{font-size:32px;font-weight:800;margin-top:2px}.sh p{color:var(--muted);max-width:620px}
.grid{display:grid;gap:20px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.course{display:flex;flex-direction:column;padding:0;overflow:hidden;transition:.18s}
.course:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,31,61,.1)}
.cover{height:130px;display:grid;place-items:center;font-size:54px;color:rgba(255,255,255,.92)}
.course .bd{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.pill{display:inline-block;background:var(--bg);color:var(--ink2);font-size:13px;font-weight:700;padding:2px 12px;border-radius:99px}
.meta{display:flex;gap:14px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.feat .ic{width:48px;height:48px;border-radius:13px;background:#fff3d6;display:grid;place-items:center;font-size:24px;margin-bottom:12px}
.feat h3{font-size:18px}.feat p{color:var(--muted);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:13px 14px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px;font-weight:700;background:#fafbfd}
.live{color:var(--ok);font-weight:700}
.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:10px}
.faq summary{font-weight:700;cursor:pointer}.faq p{color:var(--muted);margin-top:8px}
footer{background:var(--ink);color:#aab6d3;padding:36px 0;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* app pages */
.page{padding:36px 0 70px}
.crumbs{color:var(--muted);font-size:14px;margin-bottom:10px}.crumbs a{color:var(--ink2);font-weight:600}
h1.pt{font-size:32px;font-weight:800;margin-bottom:6px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start;margin-top:22px}
.lessons{padding:8px}
.les{display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:none;border:0;padding:12px;border-radius:12px;font-size:15px;color:var(--ink)}
.les:hover{background:var(--bg)}.les.on{background:#fff3d6}
.les .n{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.les.done .n{background:var(--ok);color:#fff}
.player{aspect-ratio:16/8;background:linear-gradient(135deg,var(--ink),#26427f);border-radius:14px;display:grid;place-items:center;color:#fff;text-align:center;margin-bottom:20px}
.player div{opacity:.9}.player b{font-size:44px;display:block}
.prose h3{margin:14px 0 6px;font-size:19px}.prose p,.prose li{color:#33405e}.prose ul{padding-inline-start:22px}
.eq{background:var(--bg);border-radius:10px;padding:10px 16px;margin:8px 0;font-family:'Cairo',serif;direction:ltr;text-align:center;font-size:18px}
.q{margin-bottom:22px}.q h4{font-size:17px;margin-bottom:8px}
.opt{display:block;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.opt:hover{border-color:var(--ink2)}.opt input[type=radio]{width:20px;height:20px;flex:none;margin:0;padding:0;accent-color:var(--ink2);cursor:pointer}.opt{display:flex;align-items:center;justify-content:flex-start;gap:12px;max-width:640px;padding:12px 14px;line-height:1.5;text-align:start;unicode-bidi:isolate}.opt:has(input:checked){border-color:var(--ink2);background:#eef3ff;box-shadow:0 0 0 1px var(--ink2) inset}.q h4{margin-bottom:10px}
.opt.right{border-color:var(--ok);background:#e9f7f0}.opt.wrong{border-color:var(--bad);background:#fdeeee}
.score{font-size:36px;font-weight:800}
.kpi b{font-size:30px;display:block;line-height:1.2}.kpi span{color:var(--muted);font-size:14px}
input,textarea,select{width:100%;font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;background:#fff;color:var(--ink)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 18px;font-weight:700;color:var(--muted)}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(15,31,61,.55);display:none;place-items:center;z-index:50;padding:20px}.modal.show{display:grid}
.modal .box{background:#fff;border-radius:20px;padding:28px;max-width:420px;width:100%}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:12px;z-index:60;display:none}
.note{background:#fff8e6;border:1px solid #f3dd9c;border-radius:12px;padding:12px 16px;font-size:14px;color:#6b520a}
.ann{border-inline-start:4px solid var(--accent);padding:6px 14px;margin-bottom:12px;background:#fff;border-radius:6px}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;padding:48px 20px}.hero h1{font-size:34px}.g3,.g4{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.nav nav a:not(.keep){display:none}}
@media(max-width:600px){.g3,.g2,.g4{grid-template-columns:1fr}.nav{gap:10px}.logo span{font-size:15px}section{padding:44px 0}.sh h2{font-size:26px}.tstats b{font-size:20px}table{font-size:14px}th,td{padding:10px 8px}}
@media(max-width:600px){.page{padding-left:18px!important;padding-right:18px!important}.nav nav{display:none}.nav{gap:8px;height:60px}.logo span{font-size:14px}#who{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:14px}.hero h1{font-size:30px}}
.cover{position:relative;overflow:hidden}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover{height:160px}
.lsn{margin:4px 18px 0;font-size:14px;color:#33405e}.lat{list-style:none;margin:8px 0 0}.lat li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.lat span{color:var(--muted);font-size:14px}
section[id]{scroll-margin-top:70px}header .nav nav a{white-space:nowrap}
.btn{min-height:44px}.btn.sm{min-height:38px}
.tphoto{margin:-26px -26px 18px;height:300px;border-radius:22px 22px 0 0;overflow:hidden;background:#dfe5f2}.tphoto img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
@media(max-width:600px){.tphoto{height:260px}}

.hero{padding:0!important}
.hero .wrap{padding:56px 20px 0;align-items:end;gap:24px}
.hero .wrap>div:first-child{padding-bottom:64px;align-self:center}
.hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 70% 50%,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 70% 50%,#000,transparent 70%);pointer-events:none}
.stage{position:relative;height:560px;display:flex;justify-content:center;align-items:flex-end;z-index:1}

.nameplate{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(15,31,61,.92),rgba(27,50,99,.92));border:1px solid rgba(232,163,23,.55);color:#fff;padding:10px 26px;border-radius:16px;text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.4);white-space:nowrap}

.hstats{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap}
.hstats div{border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.hstats b{display:block;font-size:26px}.hstats span{font-size:13px;color:#c6d0ea}
@media(max-width:900px){.hero .wrap{padding-top:40px}.hero .wrap>div:first-child{padding-bottom:10px}.stage{height:440px}.stage .glow{width:330px;height:330px}.stage svg.orb{width:460px;height:460px}.stage img.cut{height:425px}.chip{font-size:13px;padding:7px 12px}.chip.c1{top:30px;right:0}.chip.c2{top:150px;left:0}.chip.c3{top:270px;right:0}.hstats{gap:16px}}

.gr{background:linear-gradient(90deg,#ff6a00,#e91e8c 48%,#5b6bbf);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

.sh small{display:block}

.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(20,38,79,.18);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}

function embed(u){if(!u)return`<div class="player"><div><b>▶</b>لا يوجد فيديو لهذا الدرس بعد</div></div>`;
 let m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
 if(m)return`<div style="aspect-ratio:16/9;margin-bottom:20px"><iframe style="width:100%;height:100%;border:0;border-radius:14px" src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen></iframe></div>`;
 return`<p><a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(u)}">فتح الفيديو</a></p>`}
async function init(){try{if(sessionStorage.getItem('sg')){const {data:ss}=await sb.auth.getSession();if(ss&&ss.session){const {data:pp}=await sb.from('profiles').select('role').eq('id',ss.session.user.id).maybeSingle();sessionStorage.removeItem('sg');}}}catch(e){}
 const {data:{session}}=await sb.auth.getSession();ME=session?.user||null;
 if(ME){const {data}=await sb.from('profiles').select('*').eq('id',ME.id).single();PROF=data}
 renderNav();route()}
function renderNav(){
 $('#who').innerHTML=PROF?`<span class="wname"><span class="wf">${esc(PROF.full_name)}</span><span class="w1">${esc((w=>/\.$/.test(w[0])?w.slice(0,2).join(" "):w[0])((PROF.full_name||"").trim().split(/\s+/)))}</span></span><button class="btn ghost sm" onclick="logout()">خروج</button>`:`<button class="btn gold sm" onclick="openAuth('in')">تسجيل الدخول</button>`;
 $('#nav').innerHTML=PROF?.role==='teacher'?`<a href="#/teacher" class="keep">لوحة المدرس</a>`:PROF?`<a href="#/me" class="keep">منصتي</a>`:`<a href="#/" class="keep">الرئيسية</a><a href="javascript:void(0)" onclick="goSec('courses')">الكورسات</a><a href="javascript:void(0)" onclick="goSec('about')">عن المدرس</a><a href="javascript:void(0)" onclick="goSec('faq')">أسئلة</a>`}
async function logout(){await sb.auth.signOut();ME=PROF=null;renderNav();location.hash='#/';route()}
function openAuth(mode='in'){if(mode==='t')mode='in';const b=$('#authbox');b.dataset.mode=mode;drawAuth();$('#auth').classList.add('show')}
function drawAuth(){const m=$('#authbox').dataset.mode;$('#authbox').innerHTML=`
<h3>${m==='up'?'إنشاء حساب طالب':'تسجيل الدخول'}</h3>${m==='in'?'<p class="note" style="margin-bottom:12px">للطلاب والمدرس. بعد الدخول بتروح لصفحتك تلقائي.</p>':''}
${m==='up'?`<label>الاسم بالكامل</label><input id="a_name" autocomplete="name"><label>الصف</label><select id="a_grade">${GRADES.map(g=>`<option>${g}</option>`).join('')}</select>`:''}

<label>كلمة السر</label><input id="a_pass" type="password" autocomplete="${m==='up'?'new-password':'current-password'}" dir="ltr" placeholder="6 حروف على الأقل">
<div id="a_err" style="color:var(--bad);font-size:14px;margin-top:8px"></div>

${m==='t'?'':'<div class="adiv"><span>أو</span></div><button class="btn gold" style="width:100%" onclick="googleAuth()">الدخول بحساب Google</button>'}
<p class="aswitch">${m==='in'?'طالب جديد؟':'عندك حساب؟'} <a href="javascript:void(0)" onclick="openAuth('${m==='in'?'up':'in'}')">${m==='in'?'أنشئ حساب طالب':'سجّل دخول'}</a></p>

async function googleAuth(){sessionStorage.setItem('sg','1');const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)$('#a_err').textContent=error.message}
async function setGrade(id,g){const {error}=await sb.from('profiles').update({grade:g}).eq('id',id);if(error)toast(error.message);else toast('تم تحديد الصف')}
async function doAuth(){const m=$('#authbox').dataset.mode,email=$('#a_email').value.trim(),password=$('#a_pass').value,err=$('#a_err');err.textContent='';
 let r;if(m==='up'){const full_name=$('#a_name').value.trim();if(!full_name){err.textContent='اكتب اسمك';return}
  r=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name,grade:$('#a_grade').value}}})}
 else r=await sb.auth.signInWithPassword({email,password});
 if(r.error){err.textContent=({'Invalid login credentials':'البريد أو كلمة السر غلط','User already registered':'الحساب ده موجود، سجّل دخول','Email not confirmed':'لازم تأكد بريدك الأول من الرسالة اللي وصلتلك'})[r.error.message]||r.error.message;return}
 if(!r.data.session){$('#authbox').innerHTML='<h3>اتبعت رابط التأكيد</h3><p style="margin:12px 0">بعتنالك رسالة على بريدك. افتحها واضغط رابط التأكيد، وبعدها سجّل دخول. وبعد كده المدرس هيفعّل حسابك.</p><button class="btn" onclick="openAuth(\'in\')">تسجيل الدخول</button>';return}
 $('#auth').classList.remove('show');await init();
 location.hash=PROF?.role==='teacher'?'#/teacher':'#/me'}
function route(){const h=location.hash||'#/';const [,p,a,b]=h.split('/');
 const go=({'':home,me:student,teacher:teacher,course:()=>course(a),lesson:()=>lesson(a)})[p||''];(go||home)();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

function pickGrade(i){goSec('courses');setTimeout(()=>{const t=document.querySelectorAll('#ctabs button')[i+1];if(t)t.click()},400)}
addEventListener('scroll',()=>{const h=document.documentElement;const p=h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100;const e=document.querySelector('header');if(e)e.style.setProperty('--p',p+'%')},{passive:true});
try{(function(){const SEL='.hero .htxt>*,.hero .stage2,.sh,.gcard,.card,.shero,.tstat>div,.les,details,.chd,.tabs,.abt-pic,.abt-grid>div,.pt,.faq>*';const app=document.getElementById('app');if(!app)return;
const show=el=>{const d=Math.min(+el.dataset.fxi||0,6)*110;el.style.setProperty('--d',d+'ms');requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));setTimeout(()=>{el.classList.remove('rv','in');el.style.removeProperty('--d')},1000+d)};
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);show(e.target)}}),{threshold:.05,rootMargin:'0px 0px -5% 0px'}):null;
let t=0;const fx=()=>{app.querySelectorAll(SEL).forEach(el=>{if(el.dataset.fx||el.closest('.lcar,.ccar,.modal')||(el.parentElement&&el.parentElement.closest('.rv')))return;el.dataset.fx='1';el.dataset.fxi=[...el.parentElement.children].indexOf(el);el.classList.add('rv');if(io)io.observe(el);else show(el)})};
new MutationObserver(()=>{clearTimeout(t);t=setTimeout(fx,30)}).observe(app,{childList:true,subtree:true});fx()})()}catch(e){console.warn('fx',e)}

const BUILD='b40-2026-11-26';(async()=>{try{const t=await(await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'})).text();const m=t.match(/const BUILD='([^']+)'/);if(m&&m[1]!==BUILD&&!sessionStorage.getItem('rl')){sessionStorage.setItem('rl','1');location.replace(location.pathname+'?v='+Date.now()+location.hash)}}catch(e){}})();

 if(document.readyState!=='loading')mk();else addEventListener('DOMContentLoaded',mk);setTimeout(mk,800)})();

function cardHTML(c){const n=(c.lessons||[]).length;const cv=c.cover_url?`<img src="${esc(c.cover_url)}" alt="${esc(c.title)}" loading="lazy">`:`<span>⚛</span>`;
 return `<div class="card course"><div class="cover" style="background:${GCOL[c.grade]||GCOL['اولي ثانوي']}">${cv}</div><div class="bd"><span class="pill">${esc(c.grade||'')}</span><h3>${esc(c.title)}</h3><p style="color:var(--muted);font-size:15px">${esc(c.description||'')}</p><div class="meta"><span>${n} درس منشور</span></div>${n?`<ul class="lsn">${c.lessons.slice(0,4).map(t=>`<li>${esc(t)}</li>`).join('')}${n>4?`<li style="list-style:none;color:var(--muted)">و${n-4} دروس تانية…</li>`:''}</ul>`:'<p style="font-size:14px;color:var(--muted)">الدروس جاية قريب.</p>'}<div style="margin-top:auto;padding-top:10px">${PROF?`<a class="btn sm" href="#/${PROF.role==='teacher'?'teacher':'me'}">افتح منصتك</a>`:`<button class="btn sm gold" onclick="openAuth('up')">سجّل عشان تفتح الدروس</button>`}</div></div></div>`}
function carInit(el){clearInterval(window.CT);const trk=el.querySelector('.ctrk');if(!trk)return;const cs=[...trk.children],nav=el.querySelector('.lcn'),dots=[...el.querySelectorAll('.ldots i')],red=matchMedia('(prefers-reduced-motion:reduce)').matches,beh=red?'auto':'smooth';
 const rtl=()=>getComputedStyle(trk).direction==='rtl',pad=()=>rtl()?-8:8,edge=c=>{const a=c.getBoundingClientRect(),b=trk.getBoundingClientRect();return(rtl()?a.right-b.right:a.left-b.left)-pad()};
 const cur=()=>{let k=0,bd=1e9;cs.forEach((c,i)=>{const d=Math.abs(edge(c));if(d<bd){bd=d;k=i}});return k};
 const atEnd=()=>Math.abs(trk.scrollLeft)+trk.clientWidth>=trk.scrollWidth-3,atStart=()=>Math.abs(trk.scrollLeft)<3;
 const go=i=>{i=Math.max(0,Math.min(cs.length-1,i));trk.scrollBy({left:edge(cs[i]),behavior:beh})};
 const next=()=>{atEnd()?trk.scrollTo({left:0,behavior:beh}):go(cur()+1)},prev=()=>{atStart()?trk.scrollTo({left:rtl()?-(trk.scrollWidth):trk.scrollWidth,behavior:beh}):go(cur()-1)};
 const upd=()=>{const k=atEnd()?cs.length-1:cur();dots.forEach((d,i)=>d.classList.toggle('on',i===k))};
 const fits=()=>trk.scrollWidth<=trk.clientWidth+4;const chk=()=>{if(nav)nav.style.display=fits()?'none':'flex'};chk();addEventListener('resize',chk);
 let tk=0;trk.addEventListener('scroll',()=>{cancelAnimationFrame(tk);tk=requestAnimationFrame(upd)},{passive:true});
 el.querySelectorAll('.lcn button').forEach(b=>b.onclick=()=>{(+b.dataset.d>0?prev:next)();hv=2;setTimeout(()=>{if(hv===2)hv=0},9000)});dots.forEach((d,i)=>d.onclick=()=>go(i));
 let hv=0,vis=1;el.onmouseenter=()=>hv=1;el.onmouseleave=()=>hv=0;el.addEventListener('focusin',e=>{if(e.target.matches(':focus-visible'))hv=1});el.addEventListener('focusout',()=>{hv=0});
 if('IntersectionObserver'in window)new IntersectionObserver(es=>{vis=es[0].isIntersecting?1:0},{threshold:.35}).observe(el);
 if(!red)window.CT=setInterval(()=>{if(!document.body.contains(el)){clearInterval(window.CT);return}if(!hv&&vis&&!document.hidden&&!fits())next()},4000)}
function drawCatalog(){const el=$('#catalog');if(!el)return;
 const tabs=$('#ctabs');if(tabs)tabs.innerHTML=['all',...GRADES].map(g=>`<button class="${CATF===g?'on':''}" onclick="CATF='${g}';drawCatalog()">${g==='all'?'كل الصفوف':g}</button>`).join('');
 const list=CATF==='all'?CAT:CAT.filter(c=>c.grade===CATF);
 if(!list.length){el.className='';el.innerHTML=`<div class="card" style="grid-column:1/-1"><h3>${CAT.length?'مفيش كورسات منشورة للصف ده لسه':'الكورسات جاية قريب'}</h3><p style="color:var(--muted)">المدرس بيجهّز الكورسات. أول ما تتنشر هتظهر هنا بتفاصيلها ودروسها وغلافها.</p></div>`}else{el.className='ccar';el.innerHTML=`<div class="ctrk" tabindex="0" aria-label="الكورسات">${list.map(cardHTML).join('')}</div><div class="lcn"><button type="button" aria-label="السابق" data-d="1">›</button><div class="ldots">${list.map((x,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><button type="button" aria-label="التالي" data-d="-1">‹</button></div>`;carInit(el)};
 const ls=[];CAT.forEach(c=>(c.lessons||[]).forEach(t=>ls.push({c:c.title,t,g:c.grade})));const last=ls.slice(-3).reverse();
 const le=$('#latest');clearInterval(window.LT);if(le){le.innerHTML=last.length?`<div class="card lcar"><h3>آخر الدروس المضافة</h3><div class="lcv">${last.map((x,i)=>`<div class="ls${i?'':' on'}"><b>${esc(x.t)}</b><span>${esc(x.c)} · ${esc(x.g||'')}</span></div>`).join('')}</div>${last.length>1?`<div class="lcn"><button type="button" aria-label="السابق" data-d="1">›</button><div class="ldots">${last.map((x,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><button type="button" aria-label="التالي" data-d="-1">‹</button></div>`:''}</div>`:'';
  const cr=le.querySelector('.lcar');if(cr&&last.length>1){let k=0;const S=cr.querySelectorAll('.ls'),D=cr.querySelectorAll('.ldots i');const show=n=>{k=(n+S.length)%S.length;S.forEach((e,i)=>e.classList.toggle('on',i===k));D.forEach((e,i)=>e.classList.toggle('on',i===k))};cr.querySelectorAll('button').forEach(b=>b.onclick=()=>{show(k-(+b.dataset.d));});D.forEach((d,i)=>d.onclick=()=>show(i));let hv=0;cr.onmouseenter=()=>hv=1;cr.onmouseleave=()=>hv=0;cr.addEventListener('focusin',e=>{if(e.target.matches(':focus-visible'))hv=2});cr.addEventListener('focusout',()=>{hv=0});if(!matchMedia('(prefers-reduced-motion:reduce)').matches)window.LT=setInterval(()=>{if(!hv&&document.body.contains(cr))show(k+1)},4500)}}
 GRADES.forEach((g,i)=>{const e=$('#gc'+i);if(e)e.textContent=CAT.filter(c=>c.grade===g).length})}

 const ans={};qs.forEach((q,i)=>{ans[q.id]=+document.querySelector(`input[name=q${i}]:checked`).value});
 let r;try{r=await sb.rpc('submit_quiz',{p_lesson:id,p_answers:ans})}catch(e){r={error:{message:'مشكلة اتصال'}}}
 const {data,error}=r;
 if(error||!data){window._qdone=false;ins.forEach(x=>x.disabled=false);$('#qres').innerHTML=`<p style="color:var(--bad)">${esc(error?error.message:'حصلت مشكلة')}</p><p style="color:var(--bad)">النتيجة ما اتحفظتش. اضغط صحّح تاني</p>`;return}
 const cor=Object.fromEntries((data.answers||[]).map(x=>[x.id,x.correct]));
 qs.forEach((q,i)=>document.querySelectorAll(`input[name=q${i}]`).forEach(x=>{const o=x.closest('.opt');if(+x.value===cor[q.id])o.classList.add('right');else if(x.checked)o.classList.add('wrong')}));

<div class="card" style="margin-top:20px"><h3>الكورسات الحالية</h3><table><tr><th>الكورس</th><th>الصف</th><th>الدروس</th><th>النشر</th><th></th></tr>${(cs||[]).map(c=>`<tr><td>${c.cover_url?`<img src="${esc(c.cover_url)}" style="width:64px;height:40px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px">`:''}${esc(c.title)}<label style="font-weight:600;font-size:12px;margin:6px 0 2px">${c.cover_url?'تغيير الغلاف':'إضافة غلاف'}</label><input type="file" accept="image/jpeg,image/png,image/webp" style="font-size:12px;padding:4px" onchange="setCover('${c.id}',this)"></td><td>${esc(c.grade)}</td><td>${(ls||[]).filter(l=>l.course_id===c.id).map(l=>`<div>${esc(l.title)} <a href="javascript:void(0)" data-t="${esc(l.title)}" onclick="openQ('${l.id}',this.dataset.t)" style="color:var(--ink2);font-weight:700">الأسئلة (${qc[l.id]||0})</a></div>`).join('')||'-'}</td><td>${c.published?'<span class="live">منشور</span>':'مسودة'}</td><td><button class="btn sm ghost" onclick="pub('${c.id}',${!c.published})">${c.published?'إخفاء':'نشر'}</button></td></tr>`).join('')}</table></div>`}
async function shrink(f){const bm=await createImageBitmap(f);const sc=Math.min(1,1600/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(!blob)throw new Error('toBlob');return blob}
async function uploadCover(f){if(!f)return {url:null};let blob;try{blob=await shrink(f)}catch(e){return {err:'مش قادر أقرا الصورة دي. جرّب صورة JPG أو PNG تانية'}}if(blob.size>3*1024*1024)return {err:'الصورة لسه كبيرة، جرّب صورة أصغر'};const path=crypto.randomUUID()+'.jpg';let r;try{r=await sb.storage.from('covers').upload(path,blob,{contentType:'image/jpeg'})}catch(e){return {err:'مشكلة اتصال أثناء الرفع: '+(e.message||e)}}if(r.error)return {err:'رفع الغلاف: '+r.error.message};return {url:sb.storage.from('covers').getPublicUrl(path).data.publicUrl}}
function cmsg(t,ok){const m=document.getElementById('c_msg');if(m){m.textContent=t;m.style.color=ok?'#14915c':'#c93a3a'}toast(t)}
async function setCover(id,inp){const r=await uploadCover(inp.files[0]);if(r.err)return toast(r.err);if(!r.url)return;const {error}=await sb.from('courses').update({cover_url:r.url}).eq('id',id);if(error)toast('فشل تحديث الغلاف: '+error.message);else toast('اتحدّث الغلاف');tCourses()}
async function addCourse(){const btn=document.getElementById('c_btn');const title=$('#c_t').value.trim();if(!title)return cmsg('اكتب اسم الكورس',false);if(btn){btn.disabled=true;btn.textContent='جاري الإضافة…'}cmsg('جاري إضافة الكورس…',true);let note='',ok=false;try{const {data:ses}=await sb.auth.getSession();if(!ses||!ses.session){cmsg('الجلسة انتهت. اضغط خروج وادخل تاني وبعدين أضف الكورس',false);return}const f=$('#c_img').files[0];const {data:row,error}=await sb.from('courses').insert({title,description:$('#c_d').value,grade:$('#c_g').value}).select().single();if(error){cmsg('فشل إضافة الكورس: '+error.message,false);return}ok=true;if(f){cmsg('الكورس اتضاف. جاري رفع الغلاف…',true);const r=await uploadCover(f);if(r.err)note='الكورس اتضاف لكن الغلاف ما اترفعش ('+r.err+'). غيّر الغلاف من الجدول تحت.';else{const u=await sb.from('courses').update({cover_url:r.url}).eq('id',row.id);if(u.error)note='الكورس اتضاف لكن الغلاف ما اتحفظش ('+u.error.message+')'}}}catch(e){cmsg('حصلت مشكلة: '+(e.message||e),false);return}finally{if(btn){btn.disabled=false;btn.textContent='إضافة'}}await tCourses();cmsg(note||'اتضاف الكورس بنجاح ✓',!note)}
async function addLesson(){const title=$('#l_t').value.trim(),course_id=$('#l_c').value;if(!title||!course_id)return toast('اختار كورس واكتب عنوان');const {count}=await sb.from('lessons').select('id',{count:'exact',head:true}).eq('course_id',course_id);const {error}=await sb.from('lessons').insert({course_id,title,video_url:$('#l_v').value.trim()||null,body:$('#l_b').value,position:(count||0)+1});if(error)toast(error.message);else toast('اتضاف الدرس');tCourses()}

let QM={};
function qmsg(t,ok){const m=$('#qmsg');if(m){m.textContent=t;m.style.color=ok?'var(--ok)':'var(--bad)'}}
async function openQ(lid,title){QM={lesson:lid,title,list:[],edit:null,q:'',opts:['',''],correct:0,saving:false};drawQM();await loadQ()}
async function loadQ(){const {data,error}=await sb.rpc('admin_quizzes',{p_lesson:QM.lesson});QM.list=error?[]:(data||[]);drawQM();if(error)qmsg('تعذّر تحميل الأسئلة: '+error.message,false)}
function drawQM(){let m=$('#qm');if(!m){m=document.createElement('div');m.id='qm';m.className='qmask';document.body.appendChild(m)}
 m.innerHTML=`<div class="qbox"><div class="qh"><b>أسئلة الدرس: ${esc(QM.title)}</b><button class="btn sm ghost" onclick="closeQ()">إغلاق</button></div>
<div class="qlist">${QM.list.length?QM.list.map((x,i)=>`<div class="qi"><b>${i+1}. ${esc(x.question)}</b><ul>${(x.options||[]).map((o,j)=>`<li class="${j===x.correct?'ok':''}">${esc(o)}${j===x.correct?' ✓':''}</li>`).join('')}</ul><button class="btn sm ghost" onclick="editQ('${x.id}')">تعديل</button> <button class="btn sm ghost" onclick="delQ('${x.id}')">حذف</button></div>`).join(''):'<p style="color:var(--muted)">مفيش أسئلة للدرس ده لسه.</p>'}</div>
<div class="qform"><h4>${QM.edit?'تعديل السؤال':'سؤال جديد'}</h4><label>نص السؤال</label><textarea id="qq" rows="2" oninput="QM.q=this.value">${esc(QM.q)}</textarea><label>الاختيارات (علّم الإجابة الصح بالدايرة)</label>${QM.opts.map((o,j)=>`<div class="qo"><input type="radio" name="qc" ${QM.correct===j?'checked':''} onchange="QM.correct=${j}"><input class="qopt" value="${esc(o)}" oninput="QM.opts[${j}]=this.value" placeholder="اختيار ${j+1}">${QM.opts.length>2?`<button class="btn sm ghost" onclick="rmOpt(${j})">×</button>`:''}</div>`).join('')}${QM.opts.length<6?'<button class="btn sm ghost" onclick="addOpt()">+ اختيار</button>':''}
<div id="qmsg" style="margin:10px 0;font-weight:700;font-size:15px"></div><button class="btn" id="qsave" onclick="saveQ()">${QM.edit?'حفظ التعديل':'إضافة السؤال'}</button>${QM.edit?' <button class="btn ghost" onclick="cancelEditQ()">إلغاء التعديل</button>':''}</div></div>`}
function closeQ(){const m=$('#qm');if(m)m.remove();tCourses()}
function addOpt(){if(QM.opts.length<6){QM.opts.push('');drawQM()}}
function rmOpt(j){if(QM.opts.length<=2)return;QM.opts.splice(j,1);if(QM.correct===j)QM.correct=0;else if(QM.correct>j)QM.correct--;drawQM()}
function editQ(id){const x=QM.list.find(y=>y.id===id);if(!x)return;QM.edit=id;QM.q=x.question;QM.opts=[...(x.options||[])];QM.correct=x.correct;drawQM()}
function cancelEditQ(){QM.edit=null;QM.q='';QM.opts=['',''];QM.correct=0;drawQM()}
async function saveQ(){if(QM.saving)return;const q=(QM.q||'').trim();if(!q)return qmsg('اكتب نص السؤال',false);
 const kept=[];let nc=-1;QM.opts.forEach((o,j)=>{const t=(o||'').trim();if(t){if(j===QM.correct)nc=kept.length;kept.push(t)}});
 if(kept.length<2)return qmsg('لازم اختيارين على الأقل',false);if(new Set(kept).size!==kept.length)return qmsg('فيه اختيارين متكررين',false);if(nc<0)return qmsg('علّم الإجابة الصح على اختيار مكتوب',false);
 QM.saving=true;const b=$('#qsave');if(b)b.disabled=true;
 try{const r=QM.edit?await sb.from('quizzes').update({question:q,options:kept,correct:nc}).eq('id',QM.edit):await sb.from('quizzes').insert({lesson_id:QM.lesson,question:q,options:kept,correct:nc});
  if(r.error){QM.saving=false;if(b)b.disabled=false;return qmsg('فشل الحفظ: '+r.error.message,false)}}
 catch(e){QM.saving=false;if(b)b.disabled=false;return qmsg('مشكلة اتصال، جرّب تاني',false)}
 QM.saving=false;const was=QM.edit;QM.edit=null;QM.q='';QM.opts=['',''];QM.correct=0;await loadQ();qmsg(was?'اتحفظ التعديل':'اتضاف السؤال',true)}
async function delQ(id){if(!confirm('تحذف السؤال ده؟'))return;const {error}=await sb.from('quizzes').delete().eq('id',id);if(error){qmsg('فشل الحذف: '+error.message,false);return}if(QM.edit===id)cancelEditQ();await loadQ();qmsg('اتحذف السؤال',true)}
async function pub(id,v){await sb.from('courses').update({published:v}).eq('id',id);tCourses()}
async function qPrompt(lesson_id){const question=prompt('نص السؤال');if(!question)return;const o=prompt('الاختيارات مفصولة بـ | (مثال: 5|10|15|20)');if(!o)return;const options=o.split('|').map(s=>s.trim()).filter(Boolean);const c=parseInt(prompt(`رقم الإجابة الصحيحة (1 إلى ${options.length})`),10);if(!(c>=1&&c<=options.length))return toast('رقم غير صحيح');const {error}=await sb.from('quizzes').insert({lesson_id,question,options,correct:c-1});toast(error?error.message:'اتضاف السؤال')}
async function tHW(){const [{data:h},{data:p},{data:l}]=await Promise.all([sb.from('homework').select('*').order('submitted_at',{ascending:false}),sb.from('profiles').select('id,full_name'),sb.from('lessons').select('id,title')]);
 const pn=Object.fromEntries((p||[]).map(x=>[x.id,x.full_name])),ln=Object.fromEntries((l||[]).map(x=>[x.id,x.title]));
 $('#tb').innerHTML=`<div class="card">${(h||[]).map(x=>`<div class="ann"><b>${esc(pn[x.student_id])}</b> · ${esc(ln[x.lesson_id])}<div style="white-space:pre-wrap">${esc(x.content).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--ink2);font-weight:700">$1</a>')}</div><div style="font-size:12px;color:var(--muted)" dir="rtl"><bdi>${new Date(x.submitted_at).toLocaleDateString('ar-EG')}</bdi> · <bdi>${new Date(x.submitted_at).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}</bdi></div></div>`).join('')||'لسه مفيش واجبات.'}</div>`}
async function tAnn(){const {data}=await sb.from('announcements').select('*').order('created_at',{ascending:false});
 $('#tb').innerHTML=`<div class="card"><h3>إعلان جديد</h3><textarea id="an" rows="3"></textarea><button class="btn" style="margin-top:10px" onclick="addAnn()">نشر</button></div><div class="card" style="margin-top:16px">${(data||[]).map(a=>`<div class="ann">${esc(a.body)}</div>`).join('')}</div>`}
async function addAnn(){const body=$('#an').value.trim();if(!body)return;const {error}=await sb.from('announcements').insert({body});if(error)toast(error.message);tAnn()}
init();

async function forgot(){const email=$('#a_email').value.trim(),err=$('#a_err');if(!email){err.style.color='var(--bad)';err.textContent='اكتب بريدك الأول';return}
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
 err.style.color=error?'var(--bad)':'var(--ok)';err.textContent=error?(/rate|limit/i.test(error.message)?'اتبعت عدد كبير من الرسائل، جرّب بعد شوية':error.message):'لو البريد مسجّل هتوصلك رسالة فيها رابط تغيير كلمة السر.'}
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){const b=$('#authbox');b.dataset.mode='reset';b.innerHTML=`<h3>كلمة سر جديدة</h3><label>كلمة السر الجديدة</label><input id="n_pass" type="password" dir="ltr" autocomplete="new-password" placeholder="6 حروف على الأقل"><div id="a_err" style="color:var(--bad);font-size:14px;margin-top:8px"></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn" onclick="setNewPass()">حفظ</button></div>`;$('#auth').classList.add('show')}});
async function setNewPass(){const p=$('#n_pass').value;if(p.length<6){$('#a_err').textContent='6 حروف على الأقل';return}
 const {error}=await sb.auth.updateUser({password:p});if(error){$('#a_err').textContent=error.message;return}
 $('#auth').classList.remove('show');toast('اتغيّرت كلمة السر');await init()}


let _bn=0,_bt=null;function _busy(d){_bn=Math.max(0,_bn+d);let e=document.getElementById('busybadge');if(!e){e=document.createElement('div');e.id='busybadge';e.innerHTML='<span class="spin"></span><span>جاري التنفيذ…</span>';document.body.appendChild(e)}clearTimeout(_bt);if(_bn>0)_bt=setTimeout(()=>{e.style.display='flex'},250);else e.style.display='none'}
function _wrap(n,btn){const f=window[n];if(typeof f!=='function')return;window[n]=async function(...a){let b=null;if(btn){const t=window.event&&window.event.target;b=t&&t.closest?t.closest('button'):null;if(b&&b.dataset.busy)return}if(b){b.dataset.busy=1;b.disabled=true;b.classList.add('busy')}_busy(1);try{return await f.apply(this,a)}finally{_busy(-1);if(b){delete b.dataset.busy;b.disabled=false;b.classList.remove('busy')}}}}
['doAuth','googleAuth','forgot','setNewPass','markDone','gradeQuiz','sendHW','addCourse','addLesson','pub','addAnn','setApproved','logout'].forEach(n=>_wrap(n,true));
['setCover','setGrade','loadCatalog','student','course','lesson','teacher','tStudents','tCourses','tHW','tAnn'].forEach(n=>_wrap(n,false));
