<!doctype html>
<!-- v3 -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة الأستاذ محمد نصر | فيزياء الثانوية العامة</title>
<meta name="description" content="منصة الأستاذ محمد نصر لتعليم الفيزياء: دروس واختبارات وواجبات ومتابعة للطلاب.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1f3d;--ink2:#1b3263;--accent:#e8a317;--accent-d:#b97f06;--bg:#f6f7fb;--card:#fff;--line:#e3e7f0;--muted:#5d6985;--ok:#14915c;--bad:#c93a3a;--r:16px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1160px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo i{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-style:normal;font-size:22px}
.nav nav{display:flex;gap:6px;margin-inline-start:auto}
.nav nav a{padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted);font-size:15px}
.nav nav a:hover,.nav nav a.on{background:var(--bg);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 22px;font-weight:700;font-size:15px;background:var(--ink);color:#fff;transition:.15s}
.btn:hover{background:var(--ink2);transform:translateY(-1px)}
.btn.gold{background:var(--accent);color:#1d1400}.btn.gold:hover{background:#f2b52e}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--ink);background:#fff}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:10px}
.hero{background:linear-gradient(135deg,var(--ink) 0%,#16295a 100%);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(232,163,23,.18),transparent 45%);}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:76px 20px;position:relative}
.tag{display:inline-block;background:rgba(232,163,23,.16);color:#ffd27a;border:1px solid rgba(232,163,23,.4);padding:4px 14px;border-radius:99px;font-size:14px;font-weight:700}
.hero h1{font-size:46px;line-height:1.3;margin:16px 0;font-weight:800}
.hero h1 b{color:var(--accent)}
.hero p{color:#c6d0ea;font-size:18px;max-width:540px}
.cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}.hero .btn.ghost:hover{background:rgba(255,255,255,.1);border-color:#fff}
.tcard{background:#fff;color:var(--ink);border-radius:22px;padding:26px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#f6cf74);display:grid;place-items:center;font-size:42px;font-weight:800;color:var(--ink);margin-bottom:14px}
.tcard h3{font-size:22px}.tcard .sub{color:var(--muted);font-size:15px}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
.tstats b{display:block;font-size:24px;color:var(--ink)}.tstats span{font-size:13px;color:var(--muted)}
section{padding:68px 0}
.sh{margin-bottom:32px}.sh small{color:var(--accent-d);font-weight:800;font-size:14px}
.sh h2{font-size:32px;font-weight:800;margin-top:2px}.sh p{color:var(--muted);max-width:620px}
.grid{display:grid;gap:20px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.course{display:flex;flex-direction:column;padding:0;overflow:hidden;transition:.18s}
.course:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,31,61,.1)}
.cover{height:130px;display:grid;place-items:center;font-size:54px;color:rgba(255,255,255,.92)}
.course .bd{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.pill{display:inline-block;background:var(--bg);color:var(--ink2);font-size:13px;font-weight:700;padding:2px 12px;border-radius:99px}
.meta{display:flex;gap:14px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.feat .ic{width:48px;height:48px;border-radius:13px;background:#fff3d6;display:grid;place-items:center;font-size:24px;margin-bottom:12px}
.feat h3{font-size:18px}.feat p{color:var(--muted);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:13px 14px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px;font-weight:700;background:#fafbfd}
.live{color:var(--ok);font-weight:700}
.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:10px}
.faq summary{font-weight:700;cursor:pointer}.faq p{color:var(--muted);margin-top:8px}
footer{background:var(--ink);color:#aab6d3;padding:36px 0;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* app pages */
.page{padding:36px 0 70px}
.crumbs{color:var(--muted);font-size:14px;margin-bottom:10px}.crumbs a{color:var(--ink2);font-weight:600}
h1.pt{font-size:32px;font-weight:800;margin-bottom:6px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start;margin-top:22px}
.lessons{padding:8px}
.les{display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:none;border:0;padding:12px;border-radius:12px;font-size:15px;color:var(--ink)}
.les:hover{background:var(--bg)}.les.on{background:#fff3d6}
.les .n{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.les.done .n{background:var(--ok);color:#fff}
.player{aspect-ratio:16/8;background:linear-gradient(135deg,var(--ink),#26427f);border-radius:14px;display:grid;place-items:center;color:#fff;text-align:center;margin-bottom:20px}
.player div{opacity:.9}.player b{font-size:44px;display:block}
.prose h3{margin:14px 0 6px;font-size:19px}.prose p,.prose li{color:#33405e}.prose ul{padding-inline-start:22px}
.eq{background:var(--bg);border-radius:10px;padding:10px 16px;margin:8px 0;font-family:'Cairo',serif;direction:ltr;text-align:center;font-size:18px}
.q{margin-bottom:22px}.q h4{font-size:17px;margin-bottom:8px}
.opt{display:block;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.opt:hover{border-color:var(--ink2)}.opt input{margin-inline-end:10px}
.opt.right{border-color:var(--ok);background:#e9f7f0}.opt.wrong{border-color:var(--bad);background:#fdeeee}
.score{font-size:36px;font-weight:800}
.kpi b{font-size:30px;display:block;line-height:1.2}.kpi span{color:var(--muted);font-size:14px}
input,textarea,select{width:100%;font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;background:#fff;color:var(--ink)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 18px;font-weight:700;color:var(--muted)}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(15,31,61,.55);display:none;place-items:center;z-index:50;padding:20px}.modal.show{display:grid}
.modal .box{background:#fff;border-radius:20px;padding:28px;max-width:420px;width:100%}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:12px;z-index:60;display:none}
.note{background:#fff8e6;border:1px solid #f3dd9c;border-radius:12px;padding:12px 16px;font-size:14px;color:#6b520a}
.ann{border-inline-start:4px solid var(--accent);padding:6px 14px;margin-bottom:12px;background:#fff;border-radius:6px}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;padding:48px 20px}.hero h1{font-size:34px}.g3,.g4{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.nav nav a:not(.keep){display:none}}
@media(max-width:600px){.g3,.g2,.g4{grid-template-columns:1fr}.nav{gap:10px}.logo span{font-size:15px}section{padding:44px 0}.sh h2{font-size:26px}.tstats b{font-size:20px}table{font-size:14px}th,td{padding:10px 8px}}
@media(max-width:600px){.page{padding-left:18px!important;padding-right:18px!important}.nav nav{display:none}.nav{gap:8px;height:60px}.logo span{font-size:14px}#who{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:14px}.hero h1{font-size:30px}}
.cover{position:relative;overflow:hidden}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover{height:160px}
.lsn{margin:4px 18px 0;font-size:14px;color:#33405e}.lat{list-style:none;margin:8px 0 0}.lat li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.lat span{color:var(--muted);font-size:14px}
section[id]{scroll-margin-top:70px}header .nav nav a{white-space:nowrap}
.btn{min-height:44px}.btn.sm{min-height:38px}
.tphoto{margin:-26px -26px 18px;height:300px;border-radius:22px 22px 0 0;overflow:hidden;background:#dfe5f2}.tphoto img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
@media(max-width:600px){.tphoto{height:260px}}
</style>


</head>

<footer><div class="wrap"><span>منصة الأستاذ محمد نصر · فيزياء</span><span>الدروس والاختبارات والواجبات</span></div></footer>
<div class="modal" id="auth"><div class="box" id="authbox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://xohsjnifuhftevskqkqe.supabase.co',SB_KEY='sb_publishable_zgAOL3GFyUtKE_WrnRCCLw_SihFDIlX';
const sb=supabase.createClient(SB_URL,SB_KEY);
const GRADES=['اولي ثانوي','تانية بكالوريا','تالتة بكالوريا'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME=null,PROF=null;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
function embed(u){if(!u)return`<div class="player"><div><b>▶</b>لا يوجد فيديو لهذا الدرس بعد</div></div>`;
 let m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
 if(m)return`<div style="aspect-ratio:16/9;margin-bottom:20px"><iframe style="width:100%;height:100%;border:0;border-radius:14px" src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen></iframe></div>`;
 return`<p><a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(u)}">فتح الفيديو</a></p>`}
async function init(){
 const {data:{session}}=await sb.auth.getSession();ME=session?.user||null;
 if(ME){const {data}=await sb.from('profiles').select('*').eq('id',ME.id).single();PROF=data}
 renderNav();route()}
function renderNav(){
 $('#who').innerHTML=PROF?`<span style="font-weight:700">${esc(PROF.full_name)}</span> <button class="btn ghost sm" onclick="logout()">خروج</button>`:`<button class="btn gold sm" onclick="openAuth()">دخول / تسجيل</button>`;
 $('#nav').innerHTML=PROF?.role==='teacher'?`<a href="#/teacher" class="keep">لوحة المدرس</a>`:PROF?`<a href="#/me" class="keep">منصتي</a>`:`<a href="#/" class="keep">الرئيسية</a><a href="javascript:void(0)" onclick="goSec('courses')">الكورسات</a><a href="javascript:void(0)" onclick="goSec('about')">عن المدرس</a><a href="javascript:void(0)" onclick="goSec('faq')">أسئلة</a>`}
async function logout(){await sb.auth.signOut();ME=PROF=null;renderNav();location.hash='#/';route()}
function openAuth(mode='in'){const b=$('#authbox');b.dataset.mode=mode;drawAuth();$('#auth').classList.add('show')}
function drawAuth(){const m=$('#authbox').dataset.mode;$('#authbox').innerHTML=`
<h3>${m==='in'?'تسجيل الدخول':'إنشاء حساب طالب'}</h3>
${m==='up'?`<label>الاسم بالكامل</label><input id="a_name" autocomplete="name"><label>الصف</label><select id="a_grade">${GRADES.map(g=>`<option>${g}</option>`).join('')}</select>`:''}
<label>البريد الإلكتروني</label><input id="a_email" type="email" autocomplete="email" dir="ltr">
<label>كلمة السر</label><input id="a_pass" type="password" autocomplete="${m==='in'?'current-password':'new-password'}" dir="ltr" placeholder="6 حروف على الأقل">
<div id="a_err" style="color:var(--bad);font-size:14px;margin-top:8px"></div>
<div style="margin-top:16px"><button class="btn gold" style="width:100%" onclick="googleAuth()">الدخول بحساب Google</button></div><p style="text-align:center;color:var(--muted);font-size:13px;margin:10px 0 0">أو بالبريد وكلمة السر</p><div style="display:flex;gap:10px;margin-top:16px"><button class="btn" onclick="doAuth()">${m==='in'?'دخول':'إنشاء الحساب'}</button><button class="btn ghost" onclick="$('#auth').classList.remove('show')">إلغاء</button></div>
${m==='in'?'<p style="margin-top:12px;font-size:14px"><a href="javascript:void(0)" style="color:var(--ink2);font-weight:700" onclick="forgot()">نسيت كلمة السر؟</a></p>':''}<p style="margin-top:14px;font-size:14px;color:var(--muted)">${m==='in'?'مفيش حساب؟':'عندك حساب؟'} <a href="javascript:void(0)" style="color:var(--ink2);font-weight:700" onclick="openAuth('${m==='in'?'up':'in'}')">${m==='in'?'سجّل كطالب':'سجّل دخول'}</a></p>
${m==='up'?'<p class="note" style="margin-top:10px">حسابك بيتفعّل بعد موافقة المدرس.</p>':''}`}
async function googleAuth(){const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error)$('#a_err').textContent=error.message}
async function setGrade(id,g){const {error}=await sb.from('profiles').update({grade:g}).eq('id',id);if(error)toast(error.message);else toast('تم تحديد الصف')}
async function doAuth(){const m=$('#authbox').dataset.mode,email=$('#a_email').value.trim(),password=$('#a_pass').value,err=$('#a_err');err.textContent='';
 let r;if(m==='up'){const full_name=$('#a_name').value.trim();if(!full_name){err.textContent='اكتب اسمك';return}
  r=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name,grade:$('#a_grade').value}}})}
 else r=await sb.auth.signInWithPassword({email,password});
 if(r.error){err.textContent=({'Invalid login credentials':'البريد أو كلمة السر غلط','User already registered':'الحساب ده موجود، سجّل دخول','Email not confirmed':'لازم تأكد بريدك الأول من الرسالة اللي وصلتلك'})[r.error.message]||r.error.message;return}
 if(!r.data.session){$('#authbox').innerHTML='<h3>اتبعت رابط التأكيد</h3><p style="margin:12px 0">بعتنالك رسالة على بريدك. افتحها واضغط رابط التأكيد، وبعدها سجّل دخول. وبعد كده المدرس هيفعّل حسابك.</p><button class="btn" onclick="openAuth(\'in\')">تسجيل الدخول</button>';return}
 $('#auth').classList.remove('show');await init();location.hash=PROF?.role==='teacher'?'#/teacher':'#/me'}

 const go=({'':home,me:student,teacher:teacher,course:()=>course(a),lesson:()=>lesson(a)})[p||''];(go||home)();window.scrollTo(0,0)}

async function uploadCover(f){if(!f)return null;if(f.size>3*1024*1024){toast('الصورة أكبر من 3MB');return false}const ext=(f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg');if(!['image/png','image/webp','image/jpeg'].includes(f.type)){toast('الصورة لازم تكون JPG أو PNG أو WebP');return false}const path=crypto.randomUUID()+'.'+ext;const {error}=await sb.storage.from('covers').upload(path,f,{contentType:f.type});if(error){toast(error.message);return false}return sb.storage.from('covers').getPublicUrl(path).data.publicUrl}
async function setCover(id,inp){const u=await uploadCover(inp.files[0]);if(u===false||u===null)return;const {error}=await sb.from('courses').update({cover_url:u}).eq('id',id);if(error)toast(error.message);else toast('اتحدّث الغلاف');tCourses()}
async function addCourse(){const title=$('#c_t').value.trim();if(!title)return toast('اكتب اسم الكورس');const cu=await uploadCover($('#c_img').files[0]);if(cu===false)return;const {error}=await sb.from('courses').insert({title,description:$('#c_d').value,grade:$('#c_g').value,cover_url:cu});if(error)toast(error.message);tCourses()}
async function addLesson(){const title=$('#l_t').value.trim(),course_id=$('#l_c').value;if(!title||!course_id)return toast('اختار كورس واكتب عنوان');const {count}=await sb.from('lessons').select('id',{count:'exact',head:true}).eq('course_id',course_id);const {error}=await sb.from('lessons').insert({course_id,title,video_url:$('#l_v').value.trim()||null,body:$('#l_b').value,position:(count||0)+1});if(error)toast(error.message);else toast('اتضاف الدرس');tCourses()}
async function pub(id,v){await sb.from('courses').update({published:v}).eq('id',id);tCourses()}
async function qPrompt(lesson_id){const question=prompt('نص السؤال');if(!question)return;const o=prompt('الاختيارات مفصولة بـ | (مثال: 5|10|15|20)');if(!o)return;const options=o.split('|').map(s=>s.trim()).filter(Boolean);const c=parseInt(prompt(`رقم الإجابة الصحيحة (1 إلى ${options.length})`),10);if(!(c>=1&&c<=options.length))return toast('رقم غير صحيح');const {error}=await sb.from('quizzes').insert({lesson_id,question,options,correct:c-1});toast(error?error.message:'اتضاف السؤال')}
async function tHW(){const [{data:h},{data:p},{data:l}]=await Promise.all([sb.from('homework').select('*').order('submitted_at',{ascending:false}),sb.from('profiles').select('id,full_name'),sb.from('lessons').select('id,title')]);
 const pn=Object.fromEntries((p||[]).map(x=>[x.id,x.full_name])),ln=Object.fromEntries((l||[]).map(x=>[x.id,x.title]));
 $('#tb').innerHTML=`<div class="card">${(h||[]).map(x=>`<div class="ann"><b>${esc(pn[x.student_id])}</b> · ${esc(ln[x.lesson_id])}<div style="white-space:pre-wrap">${esc(x.content)}</div><div style="font-size:12px;color:var(--muted)">${new Date(x.submitted_at).toLocaleString('ar-EG')}</div></div>`).join('')||'لسه مفيش واجبات.'}</div>`}
async function tAnn(){const {data}=await sb.from('announcements').select('*').order('created_at',{ascending:false});
 $('#tb').innerHTML=`<div class="card"><h3>إعلان جديد</h3><textarea id="an" rows="3"></textarea><button class="btn" style="margin-top:10px" onclick="addAnn()">نشر</button></div><div class="card" style="margin-top:16px">${(data||[]).map(a=>`<div class="ann">${esc(a.body)}</div>`).join('')}</div>`}
async function addAnn(){const body=$('#an').value.trim();if(!body)return;const {error}=await sb.from('announcements').insert({body});if(error)toast(error.message);tAnn()}
init();

async function forgot(){const email=$('#a_email').value.trim(),err=$('#a_err');if(!email){err.style.color='var(--bad)';err.textContent='اكتب بريدك الأول';return}
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
 err.style.color=error?'var(--bad)':'var(--ok)';err.textContent=error?(/rate|limit/i.test(error.message)?'اتبعت عدد كبير من الرسائل، جرّب بعد شوية':error.message):'لو البريد مسجّل هتوصلك رسالة فيها رابط تغيير كلمة السر.'}
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){const b=$('#authbox');b.dataset.mode='reset';b.innerHTML=`<h3>كلمة سر جديدة</h3><label>كلمة السر الجديدة</label><input id="n_pass" type="password" dir="ltr" autocomplete="new-password" placeholder="6 حروف على الأقل"><div id="a_err" style="color:var(--bad);font-size:14px;margin-top:8px"></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn" onclick="setNewPass()">حفظ</button></div>`;$('#auth').classList.add('show')}});
async function setNewPass(){const p=$('#n_pass').value;if(p.length<6){$('#a_err').textContent='6 حروف على الأقل';return}
 const {error}=await sb.auth.updateUser({password:p});if(error){$('#a_err').textContent=error.message;return}
 $('#auth').classList.remove('show');toast('اتغيّرت كلمة السر');await init()}

</script>
