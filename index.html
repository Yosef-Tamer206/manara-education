<script>

function embed(u){if(!u)return`<div class="player"><div><b>▶</b>لا يوجد فيديو لهذا الدرس بعد</div></div>`;
 let m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
 if(m)return`<div style="aspect-ratio:16/9;margin-bottom:20px"><iframe style="width:100%;height:100%;border:0;border-radius:14px" src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen></iframe></div>`;
 return`<p><a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(u)}">فتح الفيديو</a></p>`}
async function init(){try{if(sessionStorage.getItem('sg')){const {data:ss}=await sb.auth.getSession();if(ss&&ss.session){const {data:pp}=await sb.from('profiles').select('role').eq('id',ss.session.user.id).maybeSingle();sessionStorage.removeItem('sg');if(pp&&pp.role==='teacher'){await sb.auth.signOut();setTimeout(()=>toast('ده حساب المدرس. ادخل من دخول المدرس بالبريد وكلمة السر.'),500)}}}}catch(e){}
 const {data:{session}}=await sb.auth.getSession();ME=session?.user||null;
 if(ME){const {data}=await sb.from('profiles').select('*').eq('id',ME.id).single();PROF=data}
 renderNav();route()}
function renderNav(){
 $('#who').innerHTML=PROF?`<span class="wname"><span class="wf">${esc(PROF.full_name)}</span><span class="w1">${esc((w=>/\.$/.test(w[0])?w.slice(0,2).join(" "):w[0])((PROF.full_name||"").trim().split(/\s+/)))}</span></span><button class="btn ghost sm" onclick="logout()">خروج</button>`:`<button class="btn gold sm" onclick="openAuth('in')">دخول الطالب</button> <button class="btn ghost sm" onclick="openAuth('t')">دخول المدرس</button>`;
 $('#nav').innerHTML=PROF?.role==='teacher'?`<a href="#/teacher" class="keep">لوحة المدرس</a>`:PROF?`<a href="#/me" class="keep">منصتي</a>`:`<a href="#/" class="keep">الرئيسية</a><a href="javascript:void(0)" onclick="goSec('courses')">الكورسات</a><a href="javascript:void(0)" onclick="goSec('about')">عن المدرس</a><a href="javascript:void(0)" onclick="goSec('faq')">أسئلة</a>`}
async function logout(){await sb.auth.signOut();ME=PROF=null;renderNav();location.hash='#/';route()}
function openAuth(mode='in'){const b=$('#authbox');b.dataset.mode=mode;drawAuth();$('#auth').classList.add('show')}
function drawAuth(){const m=$('#authbox').dataset.mode;$('#authbox').innerHTML=`
<h3>${m==='t'?'دخول المدرس':m==='in'?'دخول الطالب':'إنشاء حساب طالب'}</h3>${m==='t'?'<p class="note" style="margin-bottom:6px">للمدرس فقط. حساب المدرس مش بيتعمل من هنا.</p>':''}
${m==='up'?`<label>الاسم بالكامل</label><input id="a_name" autocomplete="name"><label>الصف</label><select id="a_grade">${GRADES.map(g=>`<option>${g}</option>`).join('')}</select>`:''}
<label>البريد الإلكتروني</label><input id="a_email" type="email" autocomplete="email" dir="ltr">
<label>كلمة السر</label><input id="a_pass" type="password" autocomplete="${m==='up'?'new-password':'current-password'}" dir="ltr" placeholder="6 حروف على الأقل">
<div id="a_err" style="color:var(--bad);font-size:14px;margin-top:8px"></div>
${m==='t'?'':'<div style="margin-top:16px"><button class="btn gold" style="width:100%" onclick="googleAuth()">الدخول بحساب Google</button></div><p style="text-align:center;color:var(--muted);font-size:13px;margin:10px 0 0">أو بالبريد وكلمة السر</p>'}<div style="display:flex;gap:10px;margin-top:16px"><button class="btn" onclick="doAuth()">${m==='up'?'إنشاء الحساب':'دخول'}</button><button class="btn ghost" onclick="$('#auth').classList.remove('show')">إلغاء</button></div>
${m!=='up'?'<p style="margin-top:12px;font-size:14px"><a href="javascript:void(0)" style="color:var(--ink2);font-weight:700" onclick="forgot()">نسيت كلمة السر؟</a></p>':''}${m==='t'?'<p style="margin-top:14px;font-size:14px;color:var(--muted)">طالب؟ <a href="javascript:void(0)" style="color:var(--ink2);font-weight:700" onclick="openAuth(\'in\')">ادخل من دخول الطالب</a></p>':`<p style="margin-top:14px;font-size:14px;color:var(--muted)">${m==='in'?'مفيش حساب؟':'عندك حساب؟'} <a href="javascript:void(0)" style="color:var(--ink2);font-weight:700" onclick="openAuth('${m==='in'?'up':'in'}')">${m==='in'?'سجّل كطالب':'سجّل دخول'}</a></p><p style="margin-top:6px;font-size:14px;color:var(--muted)">مدرس؟ <a href="javascript:void(0)" style="color:var(--ink2);font-weight:700" onclick="openAuth('t')">دخول المدرس</a></p>`}
${m==='up'?'<p class="note" style="margin-top:10px">حسابك بيتفعّل بعد موافقة المدرس.</p>':''}`}

async function doAuth(){const m=$('#authbox').dataset.mode,email=$('#a_email').value.trim(),password=$('#a_pass').value,err=$('#a_err');err.textContent='';
 let r;if(m==='up'){const full_name=$('#a_name').value.trim();if(!full_name){err.textContent='اكتب اسمك';return}
  r=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name,grade:$('#a_grade').value}}})}
 else r=await sb.auth.signInWithPassword({email,password});
 if(r.error){err.textContent=({'Invalid login credentials':'البريد أو كلمة السر غلط','User already registered':'الحساب ده موجود، سجّل دخول','Email not confirmed':'لازم تأكد بريدك الأول من الرسالة اللي وصلتلك'})[r.error.message]||r.error.message;return}
 if(!r.data.session){$('#authbox').innerHTML='<h3>اتبعت رابط التأكيد</h3><p style="margin:12px 0">بعتنالك رسالة على بريدك. افتحها واضغط رابط التأكيد، وبعدها سجّل دخول. وبعد كده المدرس هيفعّل حسابك.</p><button class="btn" onclick="openAuth(\'in\')">تسجيل الدخول</button>';return}
 $('#auth').classList.remove('show');await init();
 const isT=PROF?.role==='teacher';if(PROF&&((m==='t'&&!isT)||(m!=='t'&&isT))){await sb.auth.signOut();ME=PROF=null;renderNav();location.hash='#/';route();openAuth(m);$('#a_err').textContent=m==='t'?'الحساب ده مش حساب مدرس. الطالب يدخل من دخول الطالب.':'ده حساب المدرس. ادخل من دخول المدرس.';return}
 location.hash=PROF?.role==='teacher'?'#/teacher':'#/me'}

let CAT=[],CATF='all';
const GCOL={'اولي ثانوي':'linear-gradient(135deg,#1b3263,#3a5fb0)','تانية بكالوريا':'linear-gradient(135deg,#0f6b5a,#2fa88f)','تالتة بكالوريا':'linear-gradient(135deg,#8a4b0c,#e8a317)'};
function goSec(id){const go=()=>{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})};if((location.hash||'#/')!=='#/'){location.hash='#/';setTimeout(go,250)}else go()}
function cardHTML(c){const n=(c.lessons||[]).length;const cv=c.cover_url?`<img src="${esc(c.cover_url)}" alt="${esc(c.title)}" loading="lazy">`:`<span>⚛</span>`;
 return `<div class="card course"><div class="cover" style="background:${GCOL[c.grade]||GCOL['اولي ثانوي']}">${cv}</div><div class="bd"><span class="pill">${esc(c.grade||'')}</span><h3>${esc(c.title)}</h3><p style="color:var(--muted);font-size:15px">${esc(c.description||'')}</p><div class="meta"><span>${n} درس منشور</span></div>${n?`<ul class="lsn">${c.lessons.slice(0,4).map(t=>`<li>${esc(t)}</li>`).join('')}${n>4?`<li style="list-style:none;color:var(--muted)">و${n-4} دروس تانية…</li>`:''}</ul>`:'<p style="font-size:14px;color:var(--muted)">الدروس جاية قريب.</p>'}<div style="margin-top:auto;padding-top:10px">${PROF?`<a class="btn sm" href="#/${PROF.role==='teacher'?'teacher':'me'}">افتح منصتك</a>`:`<button class="btn sm gold" onclick="openAuth('up')">سجّل عشان تفتح الدروس</button>`}</div></div></div>`}
function drawCatalog(){const el=$('#catalog');if(!el)return;
 const tabs=$('#ctabs');if(tabs)tabs.innerHTML=['all',...GRADES].map(g=>`<button class="${CATF===g?'on':''}" onclick="CATF='${g}';drawCatalog()">${g==='all'?'كل الصفوف':g}</button>`).join('');
 const list=CATF==='all'?CAT:CAT.filter(c=>c.grade===CATF);
 el.innerHTML=list.length?list.map(cardHTML).join(''):`<div class="card" style="grid-column:1/-1"><h3>${CAT.length?'مفيش كورسات منشورة للصف ده لسه':'الكورسات جاية قريب'}</h3><p style="color:var(--muted)">المدرس بيجهّز الكورسات. أول ما تتنشر هتظهر هنا بتفاصيلها ودروسها وغلافها.</p></div>`;
 const ls=[];CAT.forEach(c=>(c.lessons||[]).forEach(t=>ls.push({c:c.title,t,g:c.grade})));const last=ls.slice(-6).reverse();
 const le=$('#latest');if(le)le.innerHTML=last.length?`<div class="card"><h3>آخر الدروس المضافة</h3><ul class="lat">${last.map(x=>`<li><b>${esc(x.t)}</b><span>${esc(x.c)} · ${esc(x.g||'')}</span></li>`).join('')}</ul></div>`:'';
 GRADES.forEach((g,i)=>{const e=$('#gc'+i);if(e)e.textContent=CAT.filter(c=>c.grade===g).length})}
async function loadCatalog(){const el=$('#catalog');if(!el)return;const {data,error}=await sb.rpc('public_catalog');if(!$('#catalog'))return;
 if(error){el.innerHTML='<p style="color:var(--muted)">تعذّر تحميل الكورسات دلوقتي.</p>';return}CAT=data||[];drawCatalog()}
function home(){$('#app').innerHTML=`
<section class="hero"><div class="wrap"><div class="htxt"><small class="kick">منصة الفيزياء للثانوية العامة</small>
<h1>مع <span class="gr">أ. محمد نصر</span><br><span class="gr">الفيزياء تبقى أسهل</span></h1><hr class="rule">

async function shrink(f){const bm=await createImageBitmap(f);const sc=Math.min(1,1600/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(!blob)throw new Error('toBlob');return blob}
async function uploadCover(f){if(!f)return {url:null};let blob;try{blob=await shrink(f)}catch(e){return {err:'مش قادر أقرا الصورة دي. جرّب صورة JPG أو PNG تانية'}}if(blob.size>3*1024*1024)return {err:'الصورة لسه كبيرة، جرّب صورة أصغر'};const path=crypto.randomUUID()+'.jpg';let r;try{r=await sb.storage.from('covers').upload(path,blob,{contentType:'image/jpeg'})}catch(e){return {err:'مشكلة اتصال أثناء الرفع: '+(e.message||e)}}if(r.error)return {err:'رفع الغلاف: '+r.error.message};return {url:sb.storage.from('covers').getPublicUrl(path).data.publicUrl}}
function cmsg(t,ok){const m=document.getElementById('c_msg');if(m){m.textContent=t;m.style.color=ok?'#14915c':'#c93a3a'}toast(t)}
async function setCover(id,inp){const r=await uploadCover(inp.files[0]);if(r.err)return toast(r.err);if(!r.url)return;const {error}=await sb.from('courses').update({cover_url:r.url}).eq('id',id);if(error)toast('فشل تحديث الغلاف: '+error.message);else toast('اتحدّث الغلاف');tCourses()}
async function addCourse(){const btn=document.getElementById('c_btn');const title=$('#c_t').value.trim();if(!title)return cmsg('اكتب اسم الكورس',false);if(btn){btn.disabled=true;btn.textContent='جاري الإضافة…'}cmsg('جاري إضافة الكورس…',true);let note='',ok=false;try{const {data:ses}=await sb.auth.getSession();if(!ses||!ses.session){cmsg('الجلسة انتهت. اضغط خروج وادخل تاني وبعدين أضف الكورس',false);return}const f=$('#c_img').files[0];const {data:row,error}=await sb.from('courses').insert({title,description:$('#c_d').value,grade:$('#c_g').value}).select().single();if(error){cmsg('فشل إضافة الكورس: '+error.message,false);return}ok=true;if(f){cmsg('الكورس اتضاف. جاري رفع الغلاف…',true);const r=await uploadCover(f);if(r.err)note='الكورس اتضاف لكن الغلاف ما اترفعش ('+r.err+'). غيّر الغلاف من الجدول تحت.';else{const u=await sb.from('courses').update({cover_url:r.url}).eq('id',row.id);if(u.error)note='الكورس اتضاف لكن الغلاف ما اتحفظش ('+u.error.message+')'}}}catch(e){cmsg('حصلت مشكلة: '+(e.message||e),false);return}finally{if(btn){btn.disabled=false;btn.textContent='إضافة'}}await tCourses();cmsg(note||'اتضاف الكورس بنجاح ✓',!note)}
async function addLesson(){const title=$('#l_t').value.trim(),course_id=$('#l_c').value;if(!title||!course_id)return toast('اختار كورس واكتب عنوان');const {count}=await sb.from('lessons').select('id',{count:'exact',head:true}).eq('course_id',course_id);const {error}=await sb.from('lessons').insert({course_id,title,video_url:$('#l_v').value.trim()||null,body:$('#l_b').value,position:(count||0)+1});if(error)toast(error.message);else toast('اتضاف الدرس');tCourses()}
async function pub(id,v){await sb.from('courses').update({published:v}).eq('id',id);tCourses()}
async function qPrompt(lesson_id){const question=prompt('نص السؤال');if(!question)return;const o=prompt('الاختيارات مفصولة بـ | (مثال: 5|10|15|20)');if(!o)return;const options=o.split('|').map(s=>s.trim()).filter(Boolean);const c=parseInt(prompt(`رقم الإجابة الصحيحة (1 إلى ${options.length})`),10);if(!(c>=1&&c<=options.length))return toast('رقم غير صحيح');const {error}=await sb.from('quizzes').insert({lesson_id,question,options,correct:c-1});toast(error?error.message:'اتضاف السؤال')}
async function tHW(){const [{data:h},{data:p},{data:l}]=await Promise.all([sb.from('homework').select('*').order('submitted_at',{ascending:false}),sb.from('profiles').select('id,full_name'),sb.from('lessons').select('id,title')]);
 const pn=Object.fromEntries((p||[]).map(x=>[x.id,x.full_name])),ln=Object.fromEntries((l||[]).map(x=>[x.id,x.title]));
 $('#tb').innerHTML=`<div class="card">${(h||[]).map(x=>`<div class="ann"><b>${esc(pn[x.student_id])}</b> · ${esc(ln[x.lesson_id])}<div style="white-space:pre-wrap">${esc(x.content).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--ink2);font-weight:700">$1</a>')}</div><div style="font-size:12px;color:var(--muted)" dir="rtl"><bdi>${new Date(x.submitted_at).toLocaleDateString('ar-EG')}</bdi> · <bdi>${new Date(x.submitted_at).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}</bdi></div></div>`).join('')||'لسه مفيش واجبات.'}</div>`}
async function tAnn(){const {data}=await sb.from('announcements').select('*').order('created_at',{ascending:false});
 $('#tb').innerHTML=`<div class="card"><h3>إعلان جديد</h3><textarea id="an" rows="3"></textarea><button class="btn" style="margin-top:10px" onclick="addAnn()">نشر</button></div><div class="card" style="margin-top:16px">${(data||[]).map(a=>`<div class="ann">${esc(a.body)}</div>`).join('')}</div>`}
async function addAnn(){const body=$('#an').value.trim();if(!body)return;const {error}=await sb.from('announcements').insert({body});if(error)toast(error.message);tAnn()}
init();

async function forgot(){const email=$('#a_email').value.trim(),err=$('#a_err');if(!email){err.style.color='var(--bad)';err.textContent='اكتب بريدك الأول';return}
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
 err.style.color=error?'var(--bad)':'var(--ok)';err.textContent=error?(/rate|limit/i.test(error.message)?'اتبعت عدد كبير من الرسائل، جرّب بعد شوية':error.message):'لو البريد مسجّل هتوصلك رسالة فيها رابط تغيير كلمة السر.'}
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){const b=$('#authbox');b.dataset.mode='reset';b.innerHTML=`<h3>كلمة سر جديدة</h3><label>كلمة السر الجديدة</label><input id="n_pass" type="password" dir="ltr" autocomplete="new-password" placeholder="6 حروف على الأقل"><div id="a_err" style="color:var(--bad);font-size:14px;margin-top:8px"></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn" onclick="setNewPass()">حفظ</button></div>`;$('#auth').classList.add('show')}});
async function setNewPass(){const p=$('#n_pass').value;if(p.length<6){$('#a_err').textContent='6 حروف على الأقل';return}
 const {error}=await sb.auth.updateUser({password:p});if(error){$('#a_err').textContent=error.message;return}
 $('#auth').classList.remove('show');toast('اتغيّرت كلمة السر');await init()}


let _bn=0,_bt=null;function _busy(d){_bn=Math.max(0,_bn+d);let e=document.getElementById('busybadge');if(!e){e=document.createElement('div');e.id='busybadge';e.innerHTML='<span class="spin"></span><span>جاري التنفيذ…</span>';document.body.appendChild(e)}clearTimeout(_bt);if(_bn>0)_bt=setTimeout(()=>{e.style.display='flex'},250);else e.style.display='none'}
function _wrap(n,btn){const f=window[n];if(typeof f!=='function')return;window[n]=async function(...a){let b=null;if(btn){const t=window.event&&window.event.target;b=t&&t.closest?t.closest('button'):null;if(b&&b.dataset.busy)return}if(b){b.dataset.busy=1;b.disabled=true;b.classList.add('busy')}_busy(1);try{return await f.apply(this,a)}finally{_busy(-1);if(b){delete b.dataset.busy;b.disabled=false;b.classList.remove('busy')}}}}
['doAuth','googleAuth','forgot','setNewPass','markDone','gradeQuiz','sendHW','addCourse','addLesson','pub','addAnn','setApproved','logout'].forEach(n=>_wrap(n,true));
['setCover','setGrade','loadCatalog','student','course','lesson','teacher','tStudents','tCourses','tHW','tAnn'].forEach(n=>_wrap(n,false));
