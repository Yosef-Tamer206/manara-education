name: Apply payments gate

on:
  push:
    paths:
      - bundle/patch.b64.txt

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the patch, then remove the bundle
        run: |
          base64 -d bundle/patch.b64.txt > /tmp/patch.tar.gz
          rm -rf bundle
          tar -xzf /tmp/patch.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep payments closed until the teacher sets a real number and turns them on"
          git push
      - name: Build and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to GitHub Pages" --repo "$GITHUB_REPOSITORY" --ref main
