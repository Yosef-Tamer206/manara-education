<style>
:root{--ink:#14264f;--ink2:#0046ac;--accent:#ff800a;--accent-d:#e06a00;--bg:#f4f7fb;--card:#fff;--line:#e3e7f0;--muted:#5d6985;--ok:#14915c;--bad:#c93a3a;--r:16px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Almarai','Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1160px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.logo i{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-style:normal;font-size:22px}
.nav nav{display:flex;gap:6px;margin-inline-start:auto}
.nav nav a{padding:8px 14px;border-radius:10px;font-weight:600;color:var(--muted);font-size:15px}
.nav nav a:hover,.nav nav a.on{background:var(--bg);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 22px;font-weight:700;font-size:15px;background:var(--ink);color:#fff;transition:.15s}
.btn:hover{background:var(--ink2);transform:translateY(-1px)}
.btn.gold{background:var(--accent);color:#1d1400}.btn.gold:hover{background:#f2b52e}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--ink);background:#fff}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:10px}
.hero{background:linear-gradient(135deg,var(--ink) 0%,#16295a 100%);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(232,163,23,.18),transparent 45%);}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:76px 20px;position:relative}
.tag{display:inline-block;background:rgba(232,163,23,.16);color:#ffd27a;border:1px solid rgba(232,163,23,.4);padding:4px 14px;border-radius:99px;font-size:14px;font-weight:700}
.hero h1{font-size:46px;line-height:1.3;margin:16px 0;font-weight:800}
.hero h1 b{color:var(--accent)}
.hero p{color:#c6d0ea;font-size:18px;max-width:540px}
.cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}.hero .btn.ghost:hover{background:rgba(255,255,255,.1);border-color:#fff}
.tcard{background:#fff;color:var(--ink);border-radius:22px;padding:26px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#f6cf74);display:grid;place-items:center;font-size:42px;font-weight:800;color:var(--ink);margin-bottom:14px}
.tcard h3{font-size:22px}.tcard .sub{color:var(--muted);font-size:15px}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
.tstats b{display:block;font-size:24px;color:var(--ink)}.tstats span{font-size:13px;color:var(--muted)}
section{padding:68px 0}
.sh{margin-bottom:32px}.sh small{color:var(--accent-d);font-weight:800;font-size:14px}
.sh h2{font-size:32px;font-weight:800;margin-top:2px}.sh p{color:var(--muted);max-width:620px}
.grid{display:grid;gap:20px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.course{display:flex;flex-direction:column;padding:0;overflow:hidden;transition:.18s}
.course:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,31,61,.1)}
.cover{height:130px;display:grid;place-items:center;font-size:54px;color:rgba(255,255,255,.92)}
.course .bd{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.pill{display:inline-block;background:var(--bg);color:var(--ink2);font-size:13px;font-weight:700;padding:2px 12px;border-radius:99px}
.meta{display:flex;gap:14px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}
.feat .ic{width:48px;height:48px;border-radius:13px;background:#fff3d6;display:grid;place-items:center;font-size:24px;margin-bottom:12px}
.feat h3{font-size:18px}.feat p{color:var(--muted);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:13px 14px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px;font-weight:700;background:#fafbfd}
.live{color:var(--ok);font-weight:700}
.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:10px}
.faq summary{font-weight:700;cursor:pointer}.faq p{color:var(--muted);margin-top:8px}
footer{background:var(--ink);color:#aab6d3;padding:36px 0;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* app pages */
.page{padding:36px 0 70px}
.crumbs{color:var(--muted);font-size:14px;margin-bottom:10px}.crumbs a{color:var(--ink2);font-weight:600}
h1.pt{font-size:32px;font-weight:800;margin-bottom:6px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start;margin-top:22px}
.lessons{padding:8px}
.les{display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:none;border:0;padding:12px;border-radius:12px;font-size:15px;color:var(--ink)}
.les:hover{background:var(--bg)}.les.on{background:#fff3d6}
.les .n{width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.les.done .n{background:var(--ok);color:#fff}
.player{aspect-ratio:16/8;background:linear-gradient(135deg,var(--ink),#26427f);border-radius:14px;display:grid;place-items:center;color:#fff;text-align:center;margin-bottom:20px}
.player div{opacity:.9}.player b{font-size:44px;display:block}
.prose h3{margin:14px 0 6px;font-size:19px}.prose p,.prose li{color:#33405e}.prose ul{padding-inline-start:22px}
.eq{background:var(--bg);border-radius:10px;padding:10px 16px;margin:8px 0;font-family:'Cairo',serif;direction:ltr;text-align:center;font-size:18px}
.q{margin-bottom:22px}.q h4{font-size:17px;margin-bottom:8px}
.opt{display:block;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.opt:hover{border-color:var(--ink2)}.opt input[type=radio]{width:20px;height:20px;flex:none;margin:0;padding:0;accent-color:var(--ink2);cursor:pointer}.opt{display:flex;align-items:center;justify-content:flex-start;gap:12px;max-width:640px;padding:12px 14px;line-height:1.5;text-align:start;unicode-bidi:isolate}.opt:has(input:checked){border-color:var(--ink2);background:#eef3ff;box-shadow:0 0 0 1px var(--ink2) inset}.q h4{margin-bottom:10px}
.opt.right{border-color:var(--ok);background:#e9f7f0}.opt.wrong{border-color:var(--bad);background:#fdeeee}
.score{font-size:36px;font-weight:800}
.kpi b{font-size:30px;display:block;line-height:1.2}.kpi span{color:var(--muted);font-size:14px}
input,textarea,select{width:100%;font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;background:#fff;color:var(--ink)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 18px;font-weight:700;color:var(--muted)}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(15,31,61,.55);display:none;place-items:center;z-index:50;padding:20px}.modal.show{display:grid}
.modal .box{background:#fff;border-radius:20px;padding:28px;max-width:420px;width:100%}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:12px;z-index:60;display:none}
.note{background:#fff8e6;border:1px solid #f3dd9c;border-radius:12px;padding:12px 16px;font-size:14px;color:#6b520a}
.ann{border-inline-start:4px solid var(--accent);padding:6px 14px;margin-bottom:12px;background:#fff;border-radius:6px}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr;padding:48px 20px}.hero h1{font-size:34px}.g3,.g4{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.nav nav a:not(.keep){display:none}}
@media(max-width:600px){.g3,.g2,.g4{grid-template-columns:1fr}.nav{gap:10px}.logo span{font-size:15px}section{padding:44px 0}.sh h2{font-size:26px}.tstats b{font-size:20px}table{font-size:14px}th,td{padding:10px 8px}}
@media(max-width:600px){.page{padding-left:18px!important;padding-right:18px!important}.nav nav{display:none}.nav{gap:8px;height:60px}.logo span{font-size:14px}#who{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:14px}.hero h1{font-size:30px}}
.cover{position:relative;overflow:hidden}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover{height:160px}
.lsn{margin:4px 18px 0;font-size:14px;color:#33405e}.lat{list-style:none;margin:8px 0 0}.lat li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.lat span{color:var(--muted);font-size:14px}
section[id]{scroll-margin-top:70px}header .nav nav a{white-space:nowrap}
.btn{min-height:44px}.btn.sm{min-height:38px}
.tphoto{margin:-26px -26px 18px;height:300px;border-radius:22px 22px 0 0;overflow:hidden;background:#dfe5f2}.tphoto img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
@media(max-width:600px){.tphoto{height:260px}}

.hero{padding:0!important}
.hero .wrap{padding:56px 20px 0;align-items:end;gap:24px}
.hero .wrap>div:first-child{padding-bottom:64px;align-self:center}
.hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 70% 50%,#000,transparent 70%);-webkit-mask-image:radial-gradient(circle at 70% 50%,#000,transparent 70%);pointer-events:none}
.stage{position:relative;height:560px;display:flex;justify-content:center;align-items:flex-end;z-index:1}

.nameplate{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(15,31,61,.92),rgba(27,50,99,.92));border:1px solid rgba(232,163,23,.55);color:#fff;padding:10px 26px;border-radius:16px;text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.4);white-space:nowrap}

.hstats{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap}
.hstats div{border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.hstats b{display:block;font-size:26px}.hstats span{font-size:13px;color:#c6d0ea}
@media(max-width:900px){.hero .wrap{padding-top:40px}.hero .wrap>div:first-child{padding-bottom:10px}.stage{height:440px}.stage .glow{width:330px;height:330px}.stage svg.orb{width:460px;height:460px}.stage img.cut{height:425px}.chip{font-size:13px;padding:7px 12px}.chip.c1{top:30px;right:0}.chip.c2{top:150px;left:0}.chip.c3{top:270px;right:0}.hstats{gap:16px}}

.gr{background:linear-gradient(90deg,#ff6a00,#e91e8c 48%,#5b6bbf);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

async function shrink(f){const bm=await createImageBitmap(f);const sc=Math.min(1,1600/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(!blob)throw new Error('toBlob');return blob}
async function uploadCover(f){if(!f)return {url:null};let blob;try{blob=await shrink(f)}catch(e){return {err:'مش قادر أقرا الصورة دي. جرّب صورة JPG أو PNG تانية'}}if(blob.size>3*1024*1024)return {err:'الصورة لسه كبيرة، جرّب صورة أصغر'};const path=crypto.randomUUID()+'.jpg';let r;try{r=await sb.storage.from('covers').upload(path,blob,{contentType:'image/jpeg'})}catch(e){return {err:'مشكلة اتصال أثناء الرفع: '+(e.message||e)}}if(r.error)return {err:'رفع الغلاف: '+r.error.message};return {url:sb.storage.from('covers').getPublicUrl(path).data.publicUrl}}

let _bn=0,_bt=null;function _busy(d){_bn=Math.max(0,_bn+d);let e=document.getElementById('busybadge');if(!e){e=document.createElement('div');e.id='busybadge';e.innerHTML='<span class="spin"></span><span>جاري التنفيذ…</span>';document.body.appendChild(e)}clearTimeout(_bt);if(_bn>0)_bt=setTimeout(()=>{e.style.display='flex'},250);else e.style.display='none'}
function _wrap(n,btn){const f=window[n];if(typeof f!=='function')return;window[n]=async function(...a){let b=null;if(btn){const t=window.event&&window.event.target;b=t&&t.closest?t.closest('button'):null;if(b&&b.dataset.busy)return}if(b){b.dataset.busy=1;b.disabled=true;b.classList.add('busy')}_busy(1);try{return await f.apply(this,a)}finally{_busy(-1);if(b){delete b.dataset.busy;b.disabled=false;b.classList.remove('busy')}}}}
